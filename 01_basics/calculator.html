<!doctype html>
<html lang="en">
  <head>
    <title>Calculator</title>

    <style>
      .tbl {
        border: 2px solid black;
      }

      .tbl td {
        border: 1px solid black;
        width: 60px;
        height: 60px;
        text-align: center;
        font-size: 22px;
        cursor: pointer;
      }

      #shownum {
        width: 100%;
        height: 50px;
        font-size: 24px;
        text-align: right;
        box-sizing: border-box;
        border: none;
        outline: none;
      }
    </style>
  </head>
  <body>
    <table class="tbl">
      <tr>
        <td colspan="4"><input type="text" id="shownum" /></td>
      </tr>

      <tr>
        <td onclick="getNumber(1)">1</td>
        <td onclick="getNumber(2)">2</td>
        <td onclick="getNumber(3)">3</td>
        <td onclick="getNumber('+')">+</td>
      </tr>

      <tr>
        <td onclick="getNumber(4)">4</td>
        <td onclick="getNumber(5)">5</td>
        <td onclick="getNumber(6)">6</td>
        <td onclick="getNumber('-')">-</td>
      </tr>

      <tr>
        <td onclick="getNumber(7)">7</td>
        <td onclick="getNumber(8)">8</td>
        <td onclick="getNumber(9)">9</td>
        <td onclick="getNumber('*')">*</td>
      </tr>

      <tr>
        <td onclick="getNumber('.')">.</td>
        <td onclick="getNumber(0)">0</td>
        <td onclick="calculateNum()">=</td>
        <td onclick="getNumber('/')">/</td>
      </tr>

      <tr>
        <td colspan="4" onclick="clearVal()">C (Clear)</td>
      </tr>
    </table>

    <script>
      function getNumber(x) {
        document.getElementById("shownum").value += x;
      }

      function calculateNum() {
        let num = document.getElementById("shownum").value;

        try {
          let total = eval(num);
          document.getElementById("shownum").value = total;
        } catch (error) {
          document.getElementById("shownum").value = "Error";
        }
      }

      function clearVal() {
        document.getElementById("shownum").value = "";
      }
    </script>
  </body>
</html>
