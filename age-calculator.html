<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="card">
        <header>
            <h1>Age Calculator</h1>
        </header>
        <div>
            <label>Enter your date of birth</label> <br>
            <input id="inputDob" type="date" value="2000-01-01"/>
        </div>
        <br>

        <div>
            <label>Current date</label> <br>
            <input type="date" id="cdate" value=""/>
        </div>
        <br>

        <button onclick="getDOB()">Calculate Age</button>
        <br>
        <div id="currentAge"></div>
    </div>

    <script>
        function getDOB(){

            let dob = document.getElementById('inputDob').value;
            console.log(dob);
            let cdate = document.getElementById('cdate').value;
            console.log(cdate);

               if (!dob || !cdate){
                alert('please enter both Date of Birth and Current Date.');
                return;
            }

            let newdob = new Date(dob);
            console.log(newdob);
            const currentDate = new Date(cdate);
            console.log(currentDate);

            let age = currentDate.getFullYear() - newdob.getFullYear();
            let monthDifference = currentDate.getMonth() - newdob.getMonth();
            let daysDifference = currentDate.getDate() - newdob.getDate();

            if (daysDifference < 0){
                monthDifference--;
                const previousMonth = new Date(currentDate.getFullYear(), currentDate.getMonth(), 0);
                console.log(previousMonth.getDate());
                daysDifference += previousMonth.getDate();
            }

            if (monthDifference < 0 || (monthDifference === 0 && currentDate.getDate() < newdob.getDate())){
                age--;
                monthDifference += 12;

            }
            document.getElementById('currentAge').innerHTML = `${age} _ ${monthDifference} _ ${daysDifference}`;

            
        }
    </script>


</body>
</html>
